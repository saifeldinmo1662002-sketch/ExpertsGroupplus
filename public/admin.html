px,calc((100vw - 1400px)/2));position:sticky;top:0;z-index:5}.top-actions{display:flex;gap:10px;align-items:center}.shell{max-width:1400px;margin:auto;padding:26px 22px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:24px}.side{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;height:max-content;position:sticky;top:90px}.side button{display:flex;width:100%;align-items:center;text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;color:#344054;font-weight:700;margin:2px 0}.side button.active,.side button:hover{background:#edf2fa;color:var(--blue)}.main{min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.heading h1{margin:0;font-size:25px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{display:block;font-size:25px;color:var(--navy)}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;overflow:hidden}.panel h2{font-size:16px;margin:0 0 14px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;vertical-align:top;font-size:13px}th{color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#fafbfc}td .sub{display:block;color:#667085;font-size:11px;margin-top:3px}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#eef2f7;color:#344054;font-size:11px;font-weight:750}.pill.pending,.pill.new{background:#fff2cc;color:#855b00}.pill.approved,.pill.closed{background:#dcfae6;color:#067647}.pill.rejected,.pill.spam{background:#fee4e2;color:#b42318}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;font-size:11px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.empty{padding:30px;text-align:cent @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap');
:root{--navy:#080E1F;--deep:#0E2F66;--blue:#154695;--gold:#C2A74D;--light-gold:#DFC87B;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--bg:#F8FAFC;--surface:#fff;--card-dark:#0D152F;--radius:16px}
*{box-sizing:border-box}
body{font-family:Inter,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #C2A74D80;outline-offset:2px}
.brand{gap:12px;letter-spacing:-.035em;font-weight:900}
.brand .mark{width:40px;height:40px;flex:0 0 40px;background:none;border-radius:0;transform:none;display:block;position:relative}
.mark svg{display:block;width:100%;height:100%}
.brand-wordmark{display:flex;flex-direction:column;line-height:.88;font-size:18px;font-weight:900;letter-spacing:-.045em}
.brand-wordmark .plus{color:var(--gold);font-size:9px;letter-spacing:.22em;margin-left:5px}
.auth-wrap{background:radial-gradient(circle at 15% 20%,#154695 0,transparent 34%),linear-gradient(135deg,#080E1F 0%,#0E2F66 100%);position:relative;overflow:hidden}
.auth-wrap:before{content:"";position:absolute;width:420px;height:420px;border:1px solid #ffffff16;transform:rotate(45deg);border-radius:70px;right:-170px;top:-210px}
.auth-card{position:relative;width:min(460px,100%);padding:38px;border:1px solid #ffffff80;border-radius:24px;box-shadow:0 30px 90px #02081766}
.auth-card h1{font-size:28px;letter-spacing:-.04em;color:var(--navy);margin:28px 0 6px}
.auth-card .brand{color:var(--blue)!important}
.auth-card .brand-wordmark{font-size:19px}
.auth-card .brand-wordmark .plus{font-size:10px}
.auth-card .muted{font-size:14px;line-height:1.65}
.field{gap:7px;margin:16px 0}
.field label{font-size:12px;font-weight:700;color:#334155}
.field input,.field textarea,.field select{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px #15469516;outline:0}
.btn{min-height:42px;border-radius:12px;padding:10px 16px;font-weight:700;transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.primary{background:var(--blue);color:white;box-shadow:0 5px 14px #15469522}
.primary:hover{background:var(--deep);box-shadow:0 7px 18px #15469530}
.gold{background:var(--gold);color:var(--navy)}
.light{background:#F1F5F9;color:#334155;border:1px solid var(--line)}
.danger{background:#FEF2F2;color:#B42318}
.text-btn{color:var(--blue)}
.alert{border-radius:12px}
.topbar{height:76px;background:#fff;color:var(--navy);border-bottom:1px solid var(--line);box-shadow:0 2px 8px #0f172a08;padding:0 max(24px,calc((100vw - 1440px)/2))}
.topbar .brand{color:var(--blue)}
.topbar .brand-wordmark{font-size:16px}
.topbar .brand-wordmark .plus{font-size:9px}
.topbar .note{color:var(--muted)!important}
.topbar .light{background:#F8FAFC}
.top-actions{gap:14px}
.shell{max-width:1440px;padding:30px 26px;grid-template-columns:248px minmax(0,1fr);gap:28px}
.side{background:var(--navy);border:0;border-radius:20px;padding:18px 12px;top:98px;box-shadow:0 12px 30px #080e1f20}
.side:before{content:"WORKSPACE";display:block;color:#DFC87B;font-size:10px;font-weight:800;letter-spacing:.18em;padding:8px 13px 14px}
.side button{color:#C9D4E5;padding:12px 13px;border-radius:12px;font-size:13px;gap:12px;margin:3px 0;transition:all .2s}
.side button:before{content:"";width:6px;height:6px;border-radius:50%;background:#64748B;display:inline-block;flex:0 0 6px}
.side button.active,.side button:hover{background:#154695;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side button.active:before{background:var(--gold);box-shadow:0 0 0 4px #C2A74D22}
.heading{margin-bottom:24px;align-items:center}
.heading h1{font-size:30px;letter-spacing:-.045em;color:var(--navy);font-weight:800}
.heading .muted{margin-top:5px;font-size:13px}
.cards{gap:16px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:18px;padding:21px;background:linear-gradient(135deg,#fff,#fbfdff);box-shadow:0 3px 12px #0f172a06;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;right:-22px;top:-25px;width:78px;height:78px;border-radius:22px;transform:rotate(45deg);background:#C2A74D18}
.stat b{font-size:30px;color:var(--blue);letter-spacing:-.04em;margin-top:7px}
.stat .muted{font-size:12px;font-weight:600}
.panel{border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 3px 14px #0f172a06;background:var(--surface)}
.panel h2{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:16px}
table{min-width:680px}
th,td{padding:14px 12px;border-bottom:1px solid #EDF2F7}
th{background:#F8FAFC;color:#64748B;font-size:10px;letter-spacing:.09em}
td{font-size:13px;color:#334155}
td b{color:var(--navy)}
.pill{border:1px solid transparent;padding:5px 10px;font-size:10px;letter-spacing:.02em}
.pill.pending,.pill.new{background:#FFFBEB;color:#92400E;border-color:#FDE68A}
.pill.approved,.pill.closed{background:#ECFDF3;color:#067647;border-color:#ABEFC6}
.pill.rejected,.pill.spam{background:#FEF3F2;color:#B42318;border-color:#FECDCA}
.actions{gap:8px}
.small{min-height:34px;padding:7px 11px;border-radius:10px}
.toolbar{gap:10px}
.empty{padding:42px 20px;color:#64748B}
.modal-back{background:#080E1F99;backdrop-filter:blur(5px)}
.modal{border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 80px #080e1f44}
.modal-head h2{font-size:20px;color:var(--navy);font-weight:800}
.note{color:#64748B}
@media(max-width:850px){.shell{grid-template-columns:1fr;padding:20px 16px;gap:18px}.side{display:flex;flex-wrap:nowrap;overflow:auto;border-radius:14px;padding:9px}.side:before{display:none}.side button{white-space:nowrap;flex:0 0 auto;width:auto}.side button:before{display:none}.topbar{padding:0 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.auth-card{padding:25px 22px}.topbar{height:66px}.topbar .brand-wordmark{font-size:13px}.brand .mark{width:34px;height:34px;flex-basis:34px}.top-actions{gap:6px}.top-actions #userLabel{display:none}.shell{padding:16px 12px}.heading h1{font-size:25px}.cards{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px}.stat b{font-size:25px}.panel{padding:15px;border-radius:16px}.modal{padding:20px}}
[dir=rtl] body{font-family:"Noto Sans Arabic",Inter,sans-serif}
[dir=rtl] .shell{direction:rtl}
[dir=rtl] .side button{text-align:right}
[dir=rtl] th,[dir=rtl] td{text-align:right}
[dir=rtl] .top-actions{flex-direction:row-reverse}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body>
<div id="auth" class="auth-wrap"><div class="auth-card"><div class="brand" style="color:#071a36"><span class="mark"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="38" y="14" width="24" height="24" rx="6" transform="rotate(45 50 26)" fill="#C2A74D"/><rect x="38" y="62" width="24" height="24" rx="6" transform="rotate(45 50 74)" fill="#C2A74D"/><rect x="14" y="38" width="24" height="24" rx="6" transform="rotate(45 26 50)" fill="#154695"/><rect x="62" y="38" width="24" height="24" rx="6" transform="rotate(45 74 50)" fill="#154695"/></svg></span><span class="brand-wordmark">EXPERTS<br>GROUP<span class="plus">PLUS</span></span><span class="brand-wordmark" style="font-size:10px;letter-spacing:.16em;color:#64748B;margin-left:4px">ADMIN PORTAL</span></div><h1 id="authTitle">Admin sign in</h1><p class="muted" id="authIntro">Sign in with your approved administrator account.</p><div id="authAlert" class="alert hidden"></div><form id="loginForm"><div class="field"><label>Email address</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary full">Sign in securely</button></form><form id="requestForm" class="hidden"><div class="field"><label>Full name</label><input name="name" required minlength="2"></div><div class="field"><label>Work email</label><input name="email" type="email" required></div><div class="field"><label>Password (minimum 14 characters)</label><input name="password" type="password" minlength="14" required></div><button class="btn primary full">Request admin access</button></form><div class="auth-links"><button id="toggleRequest" class="text-btn">Request access</button><a href="/en/" class="text-btn">Back to website</a></div><p class="note" style="margin-top:20px">New accounts remain pending until approved by the platform owner. Do not share administrator credentials.</p></div></div>
<div id="app" class="app hidden"><header class="topbar"><div class="brand"><span class="mark"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="38" y="14" width="24" height="24" rx="6" transform="rotate(45 50 26)" fill="#C2A74D"/><rect x="38" y="62" width="24" height="24" rx="6" transform="rotate(45 50 74)" fill="#C2A74D"/><rect x="14" y="38" width="24" height="24" rx="6" transform="rotate(45 26 50)" fill="#154695"/><rect x="62" y="38" width="24" height="24" rx="6" transform="rotate(45 74 50)" fill="#154695"/></svg></span><span class="brand-wordmark">EXPERTS<br>GROUP<span class="plus">PLUS</span></span><span style="font-size:10px;letter-spacing:.14em;color:#64748B;font-weight:800">ADMIN</span></div><div class="top-actions"><span id="userLabel" class="note" style="color:#d8e0ed"></span><button id="logout" class="btn light small">Sign out</button></div></header><div class="shell"><nav class="side"><button data-tab="overview" class="active">Overview</button><button data-tab="reviews">Reviews</button><button data-tab="operations">Operation services</button><button data-tab="consultation">Consultation options</button><button data-tab="leads">Contact submissions</button><button data-tab="links">Button links</button><button data-tab="admins" id="adminsNav" class="hidden">Admin approvals</button><button data-tab="security">Security</button></nav><main class="main" id="content"></main></div></div>
<div id="modalBack" class="modal-back hidden"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Edit item</h2><button class="btn light small" id="modalClose">Close</button></div><form id="itemForm"><div id="modalFields" class="modal-grid"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" id="modalCancel" class="btn light">Cancel</button><button class="btn primary">Save changes</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s);let me=null,activeTab='overview',cache={};
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function alertAuth(msg,error=false){$('#authAlert').textContent=msg;$('#authAlert').className='alert'+(error?' error':'')}
function showAuth(){me=null;$('#app').classList.add('hidden');$('#auth').classList.remove('hidden')}
function showApp(user){me=user;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#userLabel').textContent=`${user.name} · ${user.role}`;$('#adminsNav').classList.toggle('hidden',user.role!=='owner');go('overview')}
$('#toggleRequest').onclick=()=>{const req=$('#requestForm').classList.toggle('hidden');$('#loginForm').classList.toggle('hidden',req);$('#authTitle').textContent=req?'Request admin access':'Admin sign in';$('#authIntro').textContent=req?'An owner must approve your account before you can sign in.':'Sign in with your approved administrator account.';$('#toggleRequest').textContent=req?'Back to sign in':'Request access';$('#authAlert').classList.add('hidden')};
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});showApp(d.user)}catch(err){alertAuth(err.message,true)}};
$('#requestForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/auth/request-access',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});alertAuth(d.message);e.target.reset()}catch(err){alertAuth(err.message,true)}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});showAuth()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function go(tab){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({overview:overview,reviews:()=>contentList('reviews'),operations:()=>contentList('operations'),consultation:()=>contentList('consultation'),leads:leads,links:links,admins:admins,security:security}[tab]||overview)()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function heading(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
async function overview(){try{const d=await api('/api/admin/dashboard');$('#content').innerHTML=heading('Overview','Your website content and incoming business inquiries.')+`<div class="cards"><div class="stat"><span class="muted">Contact submissions</span><b>${d.leads.length}</b></div><div class="stat"><span class="muted">Published reviews</span><b>${(d.counts.find(x=>x.content_type==='review')||{}).count||0}</b></div><div class="stat"><span class="muted">Operation services</span><b>${(d.counts.find(x=>x.content_type==='operation')||{}).count||0}</b></div></div><section class="panel"><h2>Recent contact submissions</h2>${leadTable(d.leads.slice(0,8))}</section>${me.role==='owner'?`<section class="panel"><h2>Pending admin approvals</h2>${adminTable(d.admins.filter(a=>a.status==='pending'))}</section>`:''}`}catch(e){$('#content').textContent=e.message}}
function leadTable(rows){if(!rows.length)return '<div class="empty">No submissions yet.</div>';return `<div class="table-wrap"><table><thead><tr><th>Contact</th><th>Company / interest</th><th>Received</th><th>Status</th><th>Update</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><span class="sub">${esc(x.email)}</span></td><td>${esc(x.company||'—')}<span class="sub">${esc(x.scope||'')}<span class="sub">${esc(x.message||'')}</span></span></td><td>${new Date(x.created_at).toLocaleString()}</td><td><span class="pill ${esc(x.status)}">${esc(x.status)}</span></td><td><select onchange="setLeadStatus(${x.id},this.value)">${['new','contacted','qualified','closed','spam'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`}
async function setLeadStatus(id,status){try{await api(`/api/admin/leads/${id}`,{method:'PATCH',body:JSON.stringify({status})})}catch(e){alert(e.message)}}
async function leads(){const d=await api('/api/admin/dashboard');$('#content').innerHTML=heading('Contact submissions','All website inquiries are stored in Railway PostgreSQL.')+`<section class="panel">${leadTable(d.leads)}</section>`}
const configs={reviews:{title:'Reviews',sub:'Manage customer reviews displayed on the website.',fields:[['role','Reviewer role'],['company','Company'],['quote','Review text','textarea'],['initials','Initials'],['rating','Rating (1–5)','number']],label:x=>`${x.company||'Review'} — ${x.role||''}`},operations:{title:'Operation services',sub:'Manage service cards displayed in Expert Operations.',fields:[['title','Service title'],['tag','Category / tag'],['icon','Lucide icon name'],['desc','Description','textarea'],['benefits','Benefits (one per line)','textarea'],['advantage','Key advantage','textarea']],label:x=>x.title||'Service'},consultation:{title:'Consultation options',sub:'Manage the consultation carousel options.',fields:[['title','Option title'],['category','Category label'],['desc','Description','textarea']],label:x=>x.title||'Consultation option'}};
async function contentList(type){const c=configs[type],rows=await api('/api/admin/content/'+type);cache[type]=rows;$('#content').innerHTML=heading(c.title,c.sub,`<button class="btn primary" onclick="editItem('${type}')">+ Add new</button>`)+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Item</th><th>Details</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(c.label(x))}</b><span class="sub">${esc(x.id||x._key)}</span></td><td>${esc(x.quote||x.desc||x.advantage||'')}<span class="sub">${esc(x.tag||x.category||'')}</span></td><td><div class="actions"><button class="btn light small" onclick="editItem('${type}','${esc(x._key)}')">Edit</button><button class="btn danger small" onclick="deleteItem('${type}','${esc(x._key)}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div></section>`}
function editItem(type,key){const c=configs[type],item=key?(cache[type]||[]).find(x=>x._key===key):{};$('#modalTitle').textContent=(key?'Edit ':'Add ')+c.title.slice(0,-1);$('#modalFields').innerHTML=(key?[]:[['id','Unique item ID (optional)']]).concat(c.fields).map(([name,label,kind])=>{let value=item?.[name]??'';if(name==='benefits'&&Array.isArray(value))value=value.join('\n');return `<div class="field ${kind==='textarea'?'wide':''}"><label>${label}</label>${kind==='textarea'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" ${kind==='number'?'type="number" min="1" max="5"':'type="text"'} value="${esc(value)}" ${name==='id'?'placeholder="Generated automatically"':''}>`}</div>`}).join('');$('#modalBack').classList.remove('hidden');$('#itemForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);if(data.benefits!==undefined)data.benefits=data.benefits.split('\n').map(x=>x.trim()).filter(Boolean);if(data.rating)data.rating=Number(data.rating);if(!data.id)data.id=undefined;try{await api(key?`/api/admin/content/${type}/${encodeURIComponent(key)}`:`/api/admin/content/${type}`,{method:key?'PUT':'POST',body:JSON.stringify(data)});closeModal();await contentList(type)}catch(err){alert(err.message)}}}
async function deleteItem(type,key){if(!confirm('Delete this item from the website?'))return;try{await api(`/api/admin/content/${type}/${encodeURIComponent(key)}`,{method:'DELETE'});contentList(type)}catch(e){alert(e.message)}}
function closeModal(){$('#modalBack').classList.add('hidden')}$('#modalClose').onclick=closeModal;$('#modalCancel').onclick=closeModal;
async function links(){const rows=await api('/api/admin/links');$('#content').innerHTML=heading('Button links','Override website links by their stable key. Use https://, mailto: or tel: URLs.',`<button class="btn light" onclick="importLinks()">Scan website buttons</button> <button class="btn primary" onclick="editLink()">+ Add link</button>`)+`<section class="panel"><div class="note" style="margin-bottom:12px">Website anchors and navigation buttons can be assigned a key here. A matching key redirects the visitor to the URL you set.</div><div class="table-wrap"><table><thead><tr><th>Key</th><th>Label</th><th>Destination</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td><code>${esc(x.link_key)}</code></td><td>${esc(x.label)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></td><td><div class="actions"><button class="btn light small" onclick="editLinkByKey('${esc(x.link_key)}')">Edit</button><button class="btn danger small" onclick="deleteLink('${esc(x.link_key)}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div></section>`}
async function importLinks(){try{const html=await fetch('/en/').then(r=>r.text()),doc=new DOMParser().parseFromString(html,'text/html'),els=[...doc.querySelectorAll('a[href],button[onclick]')],items=[];for(const el of els){let label=(el.getAttribute('aria-label')||el.textContent||'Website link').trim().replace(/\s+/g,' ').slice(0,100);let key=(el.id||el.getAttribute('aria-label')||el.textContent.trim().replace(/\s+/g,' ').slice(0,48).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||`control-${els.indexOf(el)}`).toLowerCase().replace(/[^a-z0-9_.:-]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||`control-${els.indexOf(el)}`;let url=el.getAttribute('href');if(el.tagName==='BUTTON'){const m=(el.getAttribute('onclick')||'').match(/navigateTo\(['\"]([^'\"]+)/);if(m)url='/en/'+(m[1]==='home'?'':m[1]);}if(!url||url.startsWith('#')||url.startsWith('javascript:'))continue;if(url.startsWith('/'))url=location.origin+url;items.push({key,label,url})}const d=await api('/api/admin/links/bulk',{method:'POST',body:JSON.stringify({items})});alert(`Imported ${d.count} website link mappings. You can now edit their destinations.`);links()}catch(e){alert(e.message)}}
function editLinkByKey(key){api('/api/admin/links').then(rows=>editLink(rows.find(x=>x.link_key===key)||{}))}
function editLink(x={}){const key=prompt('Stable key (e.g. hero-book-call):',x.link_key||'');if(!key)return;const label=prompt('Button / link label:',x.label||key);if(label===null)return;const url=prompt('Destination URL:',x.url||'https://');if(!url)return;api('/api/admin/links/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify({label,url})}).then(links).catch(e=>alert(e.message))}
async function deleteLink(key){if(!confirm('Delete this link override?'))return;await api('/api/admin/links/'+encodeURIComponent(key),{method:'DELETE'});links()}
function adminTable(rows){if(!rows.length)return '<div class="empty">No pending requests.</div>';return `<div class="table-wrap"><table><thead><tr><th>Administrator</th><th>Requested</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${esc(a.display_name)}</b><span class="sub">${esc(a.email)}</span></td><td>${new Date(a.created_at).toLocaleString()}</td><td><span class="pill ${a.status}">${a.status}</span></td><td><div class="actions"><button class="btn primary small" onclick="approveAdmin(${a.id},'approved')">Approve</button><button class="btn danger small" onclick="approveAdmin(${a.id},'rejected')">Reject</button></div></td></tr>`).join('')}</tbody></table></div>`}
async function admins(){if(me.role!=='owner')return;const d=await api('/api/admin/dashboard');$('#content').innerHTML=heading('Admin approvals','Only the platform owner can approve or reject access requests.')+`<section class="panel"><h2>Administrator accounts</h2>${adminTable(d.admins)}</section>`}
async function approveAdmin(id,status){if(!confirm(`${status} this administrator?`))return;try{await api(`/api/admin/admins/${id}/approval`,{method:'PATCH',body:JSON.stringify({status})});admins()}catch(e){alert(e.message)}}
function security(){ $('#content').innerHTML=heading('Security','Change your administrator password. Use a unique password and a password manager.')+`<section class="panel" style="max-width:600px"><h2>Change password</h2><form id="passwordForm"><div class="field"><label>Current password</label><input type="password" name="currentPassword" required></div><div class="field"><label>New password (minimum 14 characters)</label><input type="password" name="newPassword" minlength="14" required></div><button class="btn primary">Update password</button></form><p class="note">All administrator sessions are protected by HTTP-only cookies. Keep Railway environment secrets private.</p></section>`;$('#passwordForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/api/auth/password',{method:'POST',body:JSON.stringify(d)});alert('Password updated. Please sign in again.');await api('/api/auth/logout',{method:'POST'});showAuth()}catch(err){alert(err.message)}}}
(async()=>{try{const d=await api('/api/auth/me');if(d.user)showApp(d.user)}catch(e){showAuth()}})();
</script></body></html>
