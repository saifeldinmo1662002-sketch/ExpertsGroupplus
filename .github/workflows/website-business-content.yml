name: Website business-content checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'public-site.html'
      - 'public/bpo-quote.js'
      - 'bpo-quote.js'
      - 'scripts/verify-bpo-quote.js'
      - 'public/ar-translations.json'
      - 'server.js'
      - 'package.json'
      - 'scripts/verify-business-copy.js'
      - 'scripts/bpo-profile-generator.js'
      - 'scripts/verify-bpo-profiles.js'
      - 'scripts/sync-bpo-profiles.js'
      - 'scripts/verify-page-navigation.js'
      - '.github/workflows/website-business-content.yml'
  push:
    branches: [main]
    paths:
      - 'public-site.html'
      - 'public/bpo-quote.js'
      - 'bpo-quote.js'
      - 'scripts/verify-bpo-quote.js'
      - 'public/ar-translations.json'
      - 'server.js'
      - 'package.json'
      - 'scripts/verify-business-copy.js'
permissions:
  contents: read
jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: BPO_PDF_OUTPUT_DIR=bpo-pdf-preview npm run test:bpo-profiles
      - uses: actions/upload-artifact@v4
        with:
          name: bpo-profile-previews
          path: bpo-pdf-preview/*.pdf
          retention-days: 7
      - run: npm run test:bpo-quote
      - run: npm run test:business-copy
      - run: npm run test:page-navigation
