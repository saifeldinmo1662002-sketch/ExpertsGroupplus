name: Website business-content checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'public-site.html'
      - 'public/ar-translations.json'
      - 'server.js'
      - 'package.json'
      - 'scripts/verify-business-copy.js'
      - 'scripts/verify-page-navigation.js'
      - '.github/workflows/website-business-content.yml'
  push:
    branches: [main]
    paths:
      - 'public-site.html'
      - 'public/ar-translations.json'
      - 'server.js'
      - 'package.json'
      - 'scripts/verify-business-copy.js'
permissions:
  contents: read
jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:business-copy
      - run: npm run test:page-navigation
