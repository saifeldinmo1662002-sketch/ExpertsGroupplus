name: Office proxy route checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  office-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify /office proxy routes and asset rewrites
        run: node scripts/verify-office-route.js
